services:
  # PostgreSQL Database
  - type: postgres
    name: kribble-db
    ipAllowList: []
    plan: free

  # Single Web Service - Backend + Frontend
  - type: web
    name: kribble
    runtime: docker
    rootDir: .
    dockerfilePath: ./Dockerfile

    envVars:
      - key: PORT
        value: 5000
      # Allow browser origins until you set your real deploy URL(s) in the Render dashboard.
      - key: CLIENT_URL
        value: "*"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kribble-db
          property: connectionString

      - key: USE_DATABASE
        value: "true"
    healthCheckPath: /health
    autoDeploy: true
