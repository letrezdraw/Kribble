services:
  # PostgreSQL Database
  - type: postgres
    name: kribble-2-db
    ipAllowList: []
    plan: free

  # Single Web Service - Backend + Frontend
  - type: web
    name: kribble-2
    runtime: docker
    rootDir: .
    dockerfilePath: ./Dockerfile

    envVars:
      - key: PORT
        value: 5000
      - key: DOODLE_CLIENT_URL
        value: http://localhost:5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kribble-db
          property: connectionString

      - key: USE_DATABASE
        value: "true"
    healthCheckPath: /health
    autoDeploy: true
