services:
  # Combined API + Client Service
  - type: web
    name: kribble
    runtime: node
    buildCommand: npm install --include=dev && npm run build --workspaces && cd server && npm run build

    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kribble-db
          property: connectionString

databases:
  - name: kribble-db
    databaseName: kribble
    user: kribble
    plan: free
