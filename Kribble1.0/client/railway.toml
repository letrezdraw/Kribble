# Client service configuration
[build]
builder = "nixpacks"
buildCommand = "rm -rf dist && npm run build"
cacheDirectories = []




[deploy]
startCommand = "npx vite preview --host 0.0.0.0 --port $PORT"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
healthcheckPath = "/"
healthcheckTimeout = 100
